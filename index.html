                                    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stopColor="#FFFFFF" />
                                        <stop offset="60%" stopColor="#00F0FF" />
                                        <stop offset="100%" stopColor="#0055FF" />

                    </div>
                    <div className="flex flex-col">
                        <span className="text-xl font-black font-mono tracking-tight leading-none text-transparent bg-clip-text bg-gradient-to-r from-brand-blue via-white to-brand-orange">
                            Audio<span className="text-brand-orange">Crew</span>
                        </span>
                        <span className="text-[8px] font-mono tracking-widest uppercase text-gray-400 font-bold mt-1">

            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [lang, setLang] = useState(() => localStorage.getItem('audiocrew_lang') || 'ar');
            const [isDark, setIsDark] = useState(true);
            const [mobileMenu, setMobileMenu] = useState(false);

            // Calculator Interactive State
            const [calcType, setCalcType] = useState('mosque');
            const [calcLength, setCalcLength] = useState(20);
            const [calcWidth, setCalcWidth] = useState(15);
            const [calcHeight, setCalcHeight] = useState(6);
            const [calcTier, setCalcTier] = useState('pro');

            // DSP Audio EQ Controls Simulation State
            const [eqBass, setEqBass] = useState(3);
            const [eqMid, setEqMid] = useState(-1);
            const [eqTreble, setEqTreble] = useState(4);
            const [eqGain, setEqGain] = useState(0);

            // Portfolio Modal State
            const [activePortFilter, setActivePortFilter] = useState('all');
            const [selectedProject, setSelectedProject] = useState(null);

            // Quote Form State
            const [quoteSubmitted, setQuoteSubmitted] = useState(false);
            const [quoteData, setQuoteData] = useState({});

            const t = translations[lang];

            // Handle Theme & LocalStorage
            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.className = "bg-brand-darkBg text-gray-100 antialiased selection:bg-brand-blue selection:text-black";
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.className = "bg-brand-lightBg text-gray-800 antialiased selection:bg-brand-orange selection:text-white";
                }
            }, [isDark]);

            // Handle Language Direction
            const toggleLang = () => {
                const nextLang = lang === 'ar' ? 'en' : 'ar';
                setLang(nextLang);
                localStorage.setItem('audiocrew_lang', nextLang);
                document.documentElement.dir = nextLang === 'ar' ? 'rtl' : 'ltr';
                document.documentElement.lang = nextLang;
            };

            // Canvas Background Particles Animation
            const particleCanvasRef = useRef(null);
            useEffect(() => {
                const canvas = particleCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                const particles = Array.from({ length: 45 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 2 + 1,
                    color: Math.random() > 0.5 ? '#00F0FF' : '#FF5500'
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach((p, idx) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.fill();

                        for (let j = idx + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if (dist < 140) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = isDark ? 'rgba(0, 240, 255, 0.05)' : 'rgba(0, 85, 255, 0.08)';
                                ctx.stroke();
                            }
                        }
                    });
                    animationId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationId);
                };
            }, [isDark]);

            // Interactive DSP Visualizer Canvas
            const eqCanvasRef = useRef(null);
            useEffect(() => {
                const canvas = eqCanvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationId;
                let phase = 0;

                const render = () => {
                    canvas.width = canvas.parentElement.offsetWidth;
                    canvas.height = canvas.parentElement.offsetHeight;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const bars = 40;
                    const barWidth = canvas.width / bars;

                    for (let i = 0; i < bars; i++) {
                        // Dynamically scale height based on state sliders (Bass, Mid, Treble)
                        let freqFactor = 1;
                        if (i < 12) freqFactor += eqBass * 0.12;
                        else if (i < 28) freqFactor += eqMid * 0.12;
                        else freqFactor += eqTreble * 0.12;

                        const sine = Math.sin(i * 0.2 + phase) * 0.3 + Math.cos(i * 0.15 - phase) * 0.3 + 0.5;
                        const h = Math.max(10, sine * canvas.height * 0.7 * Math.max(0.2, freqFactor + eqGain * 0.05));
                        const x = i * barWidth;
                        const y = (canvas.height - h) / 2;

                        const grad = ctx.createLinearGradient(0, y, 0, y + h);
                        grad.addColorStop(0, '#00F0FF');
                        grad.addColorStop(0.5, '#0055FF');
                        grad.addColorStop(1, '#FF5500');

                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        if (ctx.roundRect) ctx.roundRect(x + 2, y, barWidth - 4, h, 3);
                        else ctx.rect(x + 2, y, barWidth - 4, h);
                        ctx.fill();
                    }

                    phase += 0.05;
                    animationId = requestAnimationFrame(render);
                };
                render();

                return () => cancelAnimationFrame(animationId);
            }, [eqBass, eqMid, eqTreble, eqGain]);

            // Calculated Specs Logic
            const calculatedSpecs = useMemo(() => {
                const area = calcLength * calcWidth;
                const volume = area * calcHeight;
                let speakerCount = Math.ceil(area / (calcType === 'outdoor' ? 45 : 30));
                let wattage = Math.ceil(volume * (calcType === 'church' ? 2.8 : 2.2));
                let rt60 = (0.161 * volume / (area * 0.25)).toFixed(2);
                let sti = rt60 > 2.5 ? '0.58 (Fair)' : rt60 > 1.8 ? '0.68 (Good)' : '0.82 (Excellent)';
                let dsp = calcTier === 'essential' ? 'Analog Equalizer & Mixer Setup' : calcTier === 'pro' ? '8x8 Digital DSP Matrix with Active Anti-Feedback' : 'Networked Dante DSP with Auto-EQ & Speaker Delay';

                return { area, volume, speakerCount, wattage, rt60, sti, dsp };
            }, [calcLength, calcWidth, calcHeight, calcType, calcTier]);

            // Handle Quote Submit
            const handleQuoteSubmit = (e) => {
                e.preventDefault();
                const data = {
                    name: e.target.name.value,
                    phone: e.target.phone.value,
                    facility: e.target.facility.value,
                    currency: e.target.currency.value,
                    budget: e.target.budget.value,
                    desc: e.target.desc.value,
                };
                setQuoteData(data);
                setQuoteSubmitted(true);
            };

            const filteredProjects = portfolioItems.filter(p => activePortFilter === 'all' || p.category === activePortFilter);

            return (
                <div className="relative min-h-screen overflow-x-hidden">
                    {/* Background Particle Mesh Canvas */}
                    <canvas ref={particleCanvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-40" />

                    {/* HEADER / NAVIGATION */}
                    <header className={`sticky top-0 z-50 transition-all duration-300 border-b ${
                        isDark ? 'bg-brand-darkBg/90 border-gray-800/80 text-white' : 'bg-white/90 border-gray-200 text-gray-900'
                    } backdrop-blur-2xl`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <a href="#home">
                                <AudioCrewLogo isDark={isDark} />
                            </a>

                            <nav className="hidden lg:flex items-center gap-7 text-xs font-mono font-bold tracking-wide">
                                <a href="#home" className="hover:text-brand-blue transition-colors py-1">{t.nav.home}</a>
                                <a href="#services" className="hover:text-brand-blue transition-colors py-1">{t.nav.services}</a>
                                <a href="#calculator" className="hover:text-brand-blue transition-colors py-1">{t.nav.calculator}</a>
                                <a href="#portfolio" className="hover:text-brand-blue transition-colors py-1">{t.nav.portfolio}</a>
                                <a href="#process" className="hover:text-brand-blue transition-colors py-1">{t.nav.process}</a>
                                <a href="#team" className="hover:text-brand-blue transition-colors py-1">{t.nav.team}</a>
                            </nav>

                            <div className="hidden lg:flex items-center gap-4">
                                <button 
                                    onClick={() => setIsDark(!isDark)}
                                    className={`p-2.5 rounded-xl border transition-all ${
                                        isDark ? 'border-gray-800 bg-brand-cardDark text-amber-400 hover:border-amber-400' : 'border-gray-300 bg-white text-indigo-600 hover:border-indigo-600'
                                    }`}
                                    title="Toggle Theme"
                                >
                                    {isDark ? '☀️' : '🌙'}
                                </button>

                                <button 
                                    onClick={toggleLang} 
                                    className={`flex items-center gap-2 px-3 py-2 rounded-xl border text-xs font-mono font-bold transition-all ${
                                        isDark ? 'border-gray-800 bg-brand-cardDark text-gray-300 hover:border-brand-blue' : 'border-gray-300 bg-white text-gray-700 hover:border-brand-blue'
                                    }`}
                                >
                                    <span className="text-brand-orange">🌐</span>
                                    <span>{lang === 'ar' ? 'English' : 'العربية'}</span>
                                </button>

                                <a href="#quote" className="relative group overflow-hidden rounded-xl p-[1px]">
                                    <span className="absolute inset-0 bg-gradient-to-r from-brand-blue via-brand-deepBlue to-brand-orange rounded-xl"></span>
                                    <span className={`relative block px-5 py-2.5 rounded-xl text-xs font-mono font-bold uppercase transition-all ${
                                        isDark ? 'bg-brand-darkBg text-white group-hover:bg-opacity-0' : 'bg-white text-gray-900 group-hover:bg-opacity-0 group-hover:text-white'

                            <button onClick={() => setMobileMenu(!mobileMenu)} className={`lg:hidden p-2.5 rounded-xl border ${isDark ? 'border-gray-800 text-gray-300' : 'border-gray-300 text-gray-700'}`}>

                        {/* Mobile Drawer */}

                                <div className="pt-4 flex items-center justify-between border-t border-gray-700/50">

                                </div>

                    {/* HERO SECTION */}
                    <section id="home" className="relative min-h-[90vh] flex items-center justify-center py-20 z-10">

                                        <div className="space-y-2.5 font-mono text-xs">
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.calculatedArea}</span>
                                                <span className="text-white font-bold">{calculatedSpecs.area} m²</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.calculatedVolume}</span>
                                                <span className="text-white font-bold">{calculatedSpecs.volume} m³</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.speakersNeeded}</span>
                                                <span className="text-brand-orange font-bold text-sm">{calculatedSpecs.speakerCount} Loudspeakers</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.rmsPower}</span>
                                                <span className="text-emerald-400 font-bold text-sm">{calculatedSpecs.wattage} Watts RMS</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.rt60Estimate}</span>
                                                <span className="text-brand-blue font-bold">{calculatedSpecs.rt60} Seconds</span>
                                            </div>
                                            <div className="flex justify-between items-center p-2.5 rounded-lg bg-black/20">
                                                <span className="text-gray-400">{t.calculator.stiRating}</span>
                                                <span className="text-indigo-400 font-bold">{calculatedSpecs.sti}</span>
                                            </div>
                                            <div className="p-2.5 rounded-lg bg-black/20 space-y-1">
                                                <span className="text-gray-400 block text-[10px]">{t.calculator.dspSpec}</span>
                                                <span className="text-brand-blue font-bold text-[11px] leading-tight block">{calculatedSpecs.dsp}</span>
                                            </div>
                                        </div>

                                        <a href="#quote" className="block text-center bg-gradient-to-r from-brand-blue to-brand-deepBlue text-black font-bold py-3.5 rounded-xl text-xs font-mono uppercase shadow-lg hover:opacity-90 transition-all">
                                            {t.calculator.cta}
                                        </a>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </section>

                    {/* PORTFOLIO SHOWCASE SECTION */}
                    <section id="portfolio" className={`py-28 border-t relative z-10 ${isDark ? 'bg-brand-darkBg/80 border-gray-800' : 'bg-gray-100/90 border-gray-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-4 mb-16">
                                <span className="text-brand-orange font-mono text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-brand-orange/30 bg-brand-orange/10">
                                    {t.portfolio.tag}
                                </span>
                                <h2 className="text-3xl sm:text-5xl font-black gradient-text-brand">{t.portfolio.title}</h2>
                                <p className={`text-sm max-w-lg mx-auto ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{t.portfolio.subtitle}</p>

                                {/* Portfolio Filters */}
                                <div className="flex flex-wrap justify-center gap-3 pt-6 font-mono text-xs">
                                    {[
                                        { key: 'all', label: t.portfolio.filterAll },
                                        { key: 'mosque', label: t.portfolio.filterMosque },
                                        { key: 'hall', label: t.portfolio.filterHall },
                                        { key: 'outdoor', label: t.portfolio.filterOutdoor }
                                    ].map(f => (
                                        <button 
                                            key={f.key}
                                            onClick={() => setActivePortFilter(f.key)}
                                            className={`px-5 py-2.5 rounded-xl font-bold transition-all border ${
                                                activePortFilter === f.key 
                                                ? 'bg-gradient-to-r from-brand-blue to-brand-deepBlue text-black border-transparent shadow-lg' 
                                                : isDark ? 'glass-dark border-gray-800 text-gray-300' : 'glass-light border-gray-300 text-gray-700'
                                            }`}
                                        >
                                            {f.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Portfolio Cards Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {filteredProjects.map(p => (
                                    <div key={p.id} className={`p-8 rounded-3xl border flex flex-col justify-between transition-all duration-300 hover:-translate-y-2 ${isDark ? 'glass-dark border-gray-800' : 'glass-light border-gray-300'}`}>
                                        <div className="space-y-4">
                                            <span className="text-xs font-mono font-bold text-brand-blue uppercase tracking-widest block">// {p.category.toUpperCase()}</span>
                                            <h3 className="text-xl font-bold">{lang === 'ar' ? p.titleAr : p.titleEn}</h3>
                                            <p className={`text-xs leading-relaxed ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>
                                                {lang === 'ar' ? p.descAr : p.descEn}
                                            </p>
                                        </div>

                                        <div className="pt-6 border-t border-gray-700/40 mt-6 space-y-3">
                                            <div className="flex justify-between items-center text-[11px] font-mono">
                                                <span className="text-gray-500">STI Rating:</span>
                                                <span className="text-emerald-400 font-bold">{p.sti}</span>
                                            </div>
                                            <button 
                                                onClick={() => setSelectedProject(p)}
                                                className="w-full bg-brand-blue/10 hover:bg-brand-blue hover:text-black text-brand-blue border border-brand-blue/30 font-bold py-2.5 rounded-xl text-xs font-mono transition-all"
                                            >
                                                {t.portfolio.viewDetails}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* PROJECT DETAILS MODAL */}
                    {selectedProject && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div className={`p-8 rounded-3xl border max-w-lg w-full space-y-6 relative ${isDark ? 'bg-brand-cardDark border-brand-blue/40 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                <h3 className="text-2xl font-black">{lang === 'ar' ? selectedProject.titleAr : selectedProject.titleEn}</h3>
                                <p className="text-xs leading-relaxed text-gray-400">{lang === 'ar' ? selectedProject.descAr : selectedProject.descEn}</p>
                                
                                <div className="space-y-2 font-mono text-xs p-4 rounded-xl bg-black/30 border border-gray-700/50">
                                    <div><span className="text-gray-400">Integrated Tech:</span> <span className="text-brand-blue">{selectedProject.tech}</span></div>
                                    <div><span className="text-gray-400">Validated STI Index:</span> <span className="text-emerald-400 font-bold">{selectedProject.sti}</span></div>
                                </div>

                                <button onClick={() => setSelectedProject(null)} className="w-full bg-brand-orange text-white font-bold py-3 rounded-xl text-xs font-mono uppercase">
                                    {t.portfolio.closeModal}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* PROCESS TIMELINE */}
                    <section id="process" className="py-28 relative z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-4 mb-20">
                                <span className="text-brand-blue font-mono text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-brand-blue/30 bg-brand-blue/10">
                                    {t.process.tag}
                                </span>
                                <h2 className="text-3xl sm:text-5xl font-black gradient-text-brand">{t.process.title}</h2>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {t.process.steps.map((s, idx) => (
                                    <div key={idx} className={`p-8 rounded-3xl border relative ${isDark ? 'glass-dark border-gray-800' : 'glass-light border-gray-200'}`}>
                                        <span className="text-4xl font-mono font-black text-brand-blue/30 block mb-3">{s.step}</span>
                                        <h3 className="text-lg font-bold mb-2">{s.title}</h3>
                                        <p className={`text-xs leading-relaxed ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{s.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* TEAM SHOWCASE (FOUR MINDS • ONE SOUND) */}
                    <section id="team" className={`py-28 border-t relative z-10 ${isDark ? 'bg-brand-darkBg/90 border-gray-800' : 'bg-gray-100/90 border-gray-200'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-4 mb-20">
                                <span className="text-brand-orange font-mono text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-brand-orange/30 bg-brand-orange/10">
                                    {t.team.tag}
                                </span>
                                <h2 className="text-3xl sm:text-5xl font-black gradient-text-brand">{t.team.title}</h2>
                                <p className={`text-sm max-w-2xl mx-auto ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{t.team.subtitle}</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {t.team.members.map((m, idx) => (
                                    <div key={idx} className={`p-6 rounded-3xl border text-center space-y-4 ${isDark ? 'glass-dark border-gray-800' : 'glass-light border-gray-300'}`}>
                                        <div className="w-20 h-20 rounded-2xl mx-auto bg-gradient-to-tr from-brand-blue via-brand-deepBlue to-brand-orange text-black font-mono font-black text-2xl flex items-center justify-center shadow-lg">
                                            E0{idx + 1}
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-base">{m.name}</h3>
                                            <span className="text-[11px] font-mono text-brand-blue font-semibold block mt-1">{m.role}</span>
                                        </div>
                                        <p className={`text-xs leading-relaxed ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{m.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* QUOTE / WHATSAPP GENERATOR */}
                    <section id="quote" className="py-28 relative z-10">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center space-y-4 mb-16">
                                <span className="text-brand-blue font-mono text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-brand-blue/30 bg-brand-blue/10">
                                    {t.quote.tag}
                                </span>
                                <h2 className="text-3xl sm:text-5xl font-black gradient-text-brand">{t.quote.title}</h2>
                                <p className={`text-sm max-w-lg mx-auto ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{t.quote.subtitle}</p>
                            </div>

                            <div className={`p-8 sm:p-12 rounded-3xl border shadow-2xl ${isDark ? 'glass-dark border-gray-800' : 'glass-light border-gray-300'}`}>
                                {!quoteSubmitted ? (
                                    <form onSubmit={handleQuoteSubmit} className="space-y-6">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.name}</label>
                                                <input type="text" name="name" required placeholder="John Doe" className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.phone}</label>
                                                <input type="tel" name="phone" required placeholder="+20 100 000 0000" className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`} />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                            <div>
                                                <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.facility}</label>
                                                <select name="facility" className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                                    <option>{t.calculator.typeMosque}</option>
                                                    <option>{t.calculator.typeChurch}</option>
                                                    <option>{t.calculator.typeGov}</option>
                                                    <option>{t.calculator.typeOutdoor}</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.currency}</label>
                                                <select name="currency" className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                                    <option value="EGP">EGP (جنية مصري)</option>
                                                    <option value="SAR">SAR (ريال سعودي)</option>
                                                    <option value="USD">USD (Dollar)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.budget}</label>
                                                <select name="budget" className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                                    <option>{t.calculator.tierEssential}</option>
                                                    <option>{t.calculator.tierPro}</option>
                                                    <option>{t.calculator.tierAdvanced}</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-mono uppercase text-gray-400 mb-2">{t.quote.desc}</label>
                                            <textarea name="desc" rows="4" required placeholder="..." className={`w-full p-3.5 rounded-xl text-sm border focus:outline-none ${isDark ? 'bg-brand-darkBg border-gray-700 text-white' : 'bg-white border-gray-300 text-gray-900'}`}></textarea>
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-brand-blue via-brand-deepBlue to-brand-orange text-white font-bold py-4 rounded-xl text-sm font-mono uppercase shadow-xl hover:opacity-95 transition-all">
                                            {t.quote.submit}
                                        </button>
                                    </form>
                                ) : (
                                    <div className="text-center py-8 space-y-6">
                                        <div className="w-20 h-20 bg-emerald-500/10 border border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto">
                                            ✓
                                        </div>
                                        <h3 className="text-2xl font-bold">{t.quote.successTitle}</h3>
                                        <p className={`text-xs max-w-md mx-auto leading-relaxed ${isDark ? 'text-gray-400' : 'text-gray-600'}`}>{t.quote.successDesc}</p>
                                        <a 
                                            href={`https://wa.me/201000000000?text=${encodeURIComponent(`Hello AudioCrew Engineers Team,\nI submitted an acoustic inquiry:\n• Name: ${quoteData.name}\n• Phone: ${quoteData.phone}\n• Facility: ${quoteData.facility}\n• Currency & Tier: ${quoteData.currency} (${quoteData.budget})\n• Details: ${quoteData.desc}`)}`}
                                            target="_blank" 
                                            className="inline-block bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-4 rounded-xl text-xs font-mono uppercase transition-all shadow-lg"
                                        >
                                            {t.quote.whatsappBtn}
                                        </a>
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className={`py-12 border-t text-xs font-mono relative z-10 ${isDark ? 'bg-brand-darkBg border-gray-800 text-gray-500' : 'bg-white border-gray-200 text-gray-600'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
                            <AudioCrewLogo isDark={isDark} />
                            <p className="text-center">{t.footer.rights}</p>
                            <div className="flex gap-4">
                                <a href="#home" className="hover:text-brand-blue">{t.nav.home}</a>
                                <span>•</span>
                                <a href="#services" className="hover:text-brand-blue">{t.nav.services}</a>
                                <span>•</span>
                                <a href="#quote" className="hover:text-brand-blue">{t.nav.quote}</a>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
